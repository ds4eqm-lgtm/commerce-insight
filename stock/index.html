<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c4a3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="창고재고">
<meta name="robots" content="noindex">
<title>창고 재고</title>
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#17211c;--sub:#5b6b62;--line:#cbd5cf;--main:#2c4a3e;--ok:#1b6e3c;--warn:#a0521b;--red:#b3261e;--hl:#fff1b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;padding:8px 12px}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
header h1 small{font-weight:400;font-size:12px;opacity:.75;margin-left:auto}
#bar{font-size:12px;margin-top:4px;padding:3px 8px;border-radius:6px;background:#555;display:inline-block}
#bar.ok{background:#1b6e3c}#bar.err{background:#a0521b}
.tools{display:flex;gap:6px;margin-top:8px}
.tools input{flex:1;min-width:0;font-size:16px;padding:9px 10px;border-radius:8px;border:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:16px;font-weight:700;background:var(--main);color:#fff;cursor:pointer}
.btn.gray{background:#dfe5e1;color:var(--ink)}.btn.red{background:var(--red)}.btn.green{background:var(--ok)}.btn.org{background:var(--warn)}
.btn.sm{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.45}
main{padding:10px 10px 90px;max-width:760px;margin:0 auto}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cat{background:var(--card);border-radius:12px;padding:0 0 10px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-height:118px}
.cat .ic{height:30px;background:#6b74c9;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:12px;font-weight:700;gap:6px}
.cat .ic::before{content:"";width:16px;height:14px;border:2px solid #fff;border-top-width:4px;border-radius:2px;display:inline-block}
.cat .nm{font-weight:800;font-size:16px;flex:1;padding:8px 10px 4px;line-height:1.3;word-break:keep-all}
.cat .ct{font-size:13px;color:var(--sub);padding:0 10px}
.cat .wn{font-size:12px;color:var(--warn);font-weight:400;margin-top:3px}
.cat.add{align-items:center;justify-content:center;border:2px dashed #9fb3a8;background:#f7faf8;color:var(--main);font-weight:800;font-size:17px;padding:10px}
.cat.add b{font-size:40px;line-height:1}
.back{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back h2{font-size:18px;margin:0;flex:1}
.cnote{font-size:13px;color:var(--sub);background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.5;border:1px dashed var(--line)}
.grp{font-size:13px;font-weight:700;color:#33524a;margin:14px 2px 6px;padding-top:6px;border-top:2px solid #c3d3ca}
.it{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px;border:1px solid var(--line);cursor:pointer}
.it.zero{opacity:.62}
.it .top{display:flex;align-items:baseline;gap:6px}
.it .cd{font-weight:800;font-size:17px}
.it .nm{font-size:16px;flex:1}
.it .sum{font-weight:800;font-size:17px;white-space:nowrap}
.it .nt{font-size:12px;color:var(--sub);margin-top:2px}
.it .cn{font-size:12px;color:var(--sub)}
.lots{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lot{font-size:13px;background:#edf3ef;border-radius:7px;padding:3px 7px;white-space:nowrap}
.lot b{font-size:14px}
.lot.old{background:#fde7d3;box-shadow:inset 0 0 0 1.5px var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#fff;margin-right:4px;vertical-align:middle}
.t-disc{background:#777}.t-add{background:#1b6e3c}.t-edit{background:#1f5fa0}.t-del{background:#b3261e}.t-undo{background:#666}.t-seed{background:#7a4fb0}
.hit{background:var(--hl)!important}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot .btn{flex:1;min-width:140px}
.note{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.6}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 8px;font-size:19px}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
.box input,.box select,.box textarea{width:100%;font-size:18px;padding:9px;border:2px solid var(--line);border-radius:10px;background:#fff}
.box input[type=checkbox]{width:auto;transform:scale(1.4);margin-right:8px}
.box input:focus{border-color:var(--main);outline:0}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .wide{grid-column:1/-1}
.lr{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #eef1ef;cursor:pointer}
.lr .q{font-weight:800;font-size:18px;min-width:52px}
.lr .d{font-size:15px;flex:1}
.lr .n{font-size:13px;color:var(--sub)}
.lr.old{background:#fff4ea}
.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.hist h4{margin:4px 0 6px;font-size:15px}
.hi{font-size:13px;padding:7px 0;border-bottom:1px solid #eef1ef;line-height:1.5}
.hi .w{color:var(--sub)}
.hi button{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;margin-left:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;display:none;max-width:92vw;text-align:center}
.setup{background:#fff;border-radius:12px;padding:14px;line-height:1.7;font-size:15px}
.setup .btn{width:100%;margin:6px 0}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr img,#qr canvas{width:220px;height:220px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#f4f6f5;padding:8px;border-radius:8px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;background:#fff;border-radius:12px}
</style>
</head>

/* 바뀐 것(op)을 받은 기록에 얹는다. 같은 op가 이미 올라가 있으면 건너뛴다.
   op 종류: item(품목), lot(수량·생산일자 한 줄), cat(분류), seed(처음 자료) / u가 있으면 되돌리기 */
function applyOp(D,op){
  if(D.log.some(x=>x.id===op.id))return;
  const by=op.by||'',t=op.t,L=(o)=>D.log.push(Object.assign({id:op.id,t,by},o));
  if(op.a==='seed'){if(D.cats.length||Object.keys(D.items).length)return;const S=JSON.parse(JSON.stringify(SEED));D.cats=S.cats;D.items=S.items;D.lots=S.lots;
    L({k:'seed',act:'seed',key:'',n:Object.keys(S.items).length+'개 품목, '+Object.keys(S.lots).length+'줄'});return}
  if(op.a==='cat'){const i=D.cats.findIndex(c=>c.id===op.c),before=i>=0?D.cats[i]:null;
    if(op.v){const v=Object.assign({id:op.c,warn:before&&before.warn||[]},op.v);if(i>=0)D.cats[i]=v;else D.cats.push(v)}
    else{if(i<0)return;if(Object.values(D.items).some(it=>it.c===op.c))return;D.cats.splice(i,1)}
    L({k:'cat',key:op.c,act:op.u?'undo':!before?'add':op.v?'edit':'del',from:before,to:op.v||null,u:op.u});return}
  if(op.a==='item'){const before=D.items[op.i]||null;let fromLots=null;
    if(op.v){const v=Object.assign({},op.v);const rl=v._lots;delete v._lots;D.items[op.i]=v;if(rl)Object.assign(D.lots,rl)}
    else{if(!before)return;fromLots={};Object.entries(D.lots).forEach(([k,l])=>{if(l.i===op.i){fromLots[k]=l;delete D.lots[k]}});delete D.items[op.i]}
    L({k:'item',key:op.i,i:op.i,act:op.u?'undo':!before?'add':op.v?'edit':'del',from:before?Object.assign({},before,fromLots&&Object.keys(fromLots).length?{_lots:fromLots}:{}):null,to:op.v||null,u:op.u});return}
  if(op.a==='lot'){const before=D.lots[op.l]||null;
    if(op.v){if(!D.items[op.v.i])return;D.lots[op.l]=Object.assign({},op.v)}else{if(!before)return;delete D.lots[op.l]}
    L({k:'lot',key:op.l,i:(op.v||before).i,act:op.u?'undo':!before?'add':op.v?'edit':'del',from:before,to:op.v||null,u:op.u});return}}
function view(){const D=JSON.parse(JSON.stringify(data||blank()));pend.forEach(op=>applyOp(D,op));return D}
async function sync(force,depth){if(!cfg.tok)return;depth=depth||0;
  if(busy){if(force||pend.length)setTimeout(()=>sync(force),1200);return}busy=true;
  try{
    const changed=await pull(force||depth>0);
    if(pend.length){
      const D=JSON.parse(JSON.stringify(data||blank())),sent=pend.slice();sent.forEach(op=>applyOp(D,op));
      const body={message:'창고 재고 '+sent.map(o=>o.a+(o.u?'되돌림':'')).join(', ').slice(0,80)+' ('+(cfg.name||'이름 없음')+')',content:b64e(new TextEncoder().encode(JSON.stringify(D)))};if(sha)body.sha=sha;
      const p=await gh('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
      if((p.status===409||p.status===422)&&depth<4){busy=false;etag='';return sync(true,depth+1)}
      if(!p.ok)throw new Error(ghErr(p));
      const pj=await p.json();sha=pj.content&&pj.content.sha||'';etag='';data=D;noFile=false;sv('cache',data);
      pend=pend.filter(o=>!sent.some(s=>s.id===o.id));sv('pend',pend);render()}
    else if(changed)render();
    st={k:'ok',t:'',at:Date.now()};
  }catch(e){st={k:'err',t:MSG[e.message]||MSG.net,code:e.message,at:st.at}}
  finally{busy=false;bar()}}
function push(op){op.id=uid();op.t=Date.now();op.by=cfg.name||'';pend.push(op);sv('pend',pend);render();sync(true)}
function bar(){const b=$('#bar');if(!cfg.tok){b.className='err';b.textContent='처음 설정이 필요합니다';return}
  let t;if(st.k==='err')t=(st.code==='net'?'인터넷 없음':'확인 필요 (눌러 보기)')+(pend.length?' · 올릴 것 '+pend.length+'개 보관 중':'');
  else if(st.k==='ok')t='모두 맞춤 · '+new Date(st.at).toLocaleTimeString('ko-KR')+' 확인'+(pend.length?' · 올리는 중 '+pend.length:'');
  else t='맞추는 중';b.className=st.k==='ok'&&!pend.length?'ok':st.k==='err'?'err':'';b.textContent=t;
  b.onclick=st.k==='err'?()=>toast(st.t,5000):null}

/* ---------- 계산 ---------- */
function lotsOf(D,iid){return Object.entries(D.lots).filter(([k,l])=>l.i===iid).map(([k,l])=>Object.assign({k},l)).sort((a,b)=>(a.o||0)-(b.o||0))}
function sumL(ls){return ls.reduce((s,l)=>s+(+l.q||0),0)}
function oldestK(ls){let o=null;ls.forEach(l=>{if(/^\d{8}$/.test(l.d||'')&&(+l.q||0)>0&&(!o||l.d<o.d))o=l});return o&&o.k}
function itemsOf(D,cid){return Object.entries(D.items).filter(([k,it])=>it.c===cid).map(([k,it])=>Object.assign({k},it)).sort((a,b)=>(a.o||0)-(b.o||0))}
function catName(D,cid){const c=D.cats.find(c=>c.id===cid);return c?c.name:'(분류 없음)'}
function matchItem(D,it,q){q=q.toLowerCase().replace(/\s/g,'');const hay=[it.code,it.name,it.note,it.g].join(' ').toLowerCase().replace(/\s/g,'');if(hay.includes(q))return true;
  return lotsOf(D,it.k).some(l=>String(l.d).includes(q)||String(fmtS(l.d)).includes(q)||String(l.n||'').replace(/\s/g,'').includes(q))}

/* ---------- 화면 ---------- */
function itemCard(D,it,q,showCat){const ls=lotsOf(D,it.k),ok=oldestK(ls),s=sumL(ls);
  return `<div class="it${s?'':' zero'}" data-i="${esc(it.k)}"><div class="top"><span class="cd">${esc(it.code||'')}</span><span class="nm">${it.disc?'<span class="tag t-disc">단종</span>':''}${esc(it.name||'')}</span><span class="sum">${s?num(s):'없음'}</span></div>`+
   (showCat?`<div class="cn">${esc(catName(D,it.c))}${it.g?' · '+esc(it.g):''}</div>`:'')+(it.note?`<div class="nt">${esc(it.note)}</div>`:'')+
   (ls.length?'<div class="lots">'+ls.map(l=>`<span class="lot${l.k===ok?' old':''}${q&&(String(l.d).includes(q)||fmtS(l.d).includes(q))?' hit':''}"><b>${esc(num(l.q))}</b>${l.d?' · '+esc(fmtS(l.d)):''}${l.n?' · '+esc(l.n):''}</span>`).join('')+'</div>':'')+'</div>'}
function render(){const m=$('#main');if(!cfg.tok){setup();return}
  const D=view(),q=$('#q').value.trim();let h='';
  if(!D.cats.length){h=`<div class="empty">아직 재고 기록이 없습니다.<br><br>${noFile||data?'':'불러오는 중입니다...<br><br>'}<button class="btn green" id="bSeed" style="width:100%">처음 자료 넣기 (창고 메모 사진에서 옮겨 적은 것)</button><div class="note">사진 15장에서 옮겨 적은 ${Object.keys(SEED.items).length}개 품목, ${Object.keys(SEED.lots).length}줄이 들어갑니다. 넣은 뒤에도 하나씩 고칠 수 있고, 모두 이력에 남습니다.</div></div>`;
    h+=footHtml();m.innerHTML=h;$('#bSeed').onclick=()=>needName(()=>{push({a:'seed'});toast('처음 자료를 넣었습니다')});bindFoot();bar();return}
  if(q){const its=Object.entries(D.items).map(([k,it])=>Object.assign({k},it)).filter(it=>matchItem(D,it,q)).sort((a,b)=>(a.o||0)-(b.o||0));
    h=`<div class="back"><h2>찾기: "${esc(q)}" ${its.length}개</h2><button class="btn gray sm" id="bQx">지우기</button></div>`+(its.length?its.map(it=>itemCard(D,it,q,true)).join(''):'<div class="empty">찾는 품목이 없습니다</div>');
    m.innerHTML=h;$('#bQx').onclick=()=>{$('#q').value='';render()};bindItems();bar();return}
  const cat=nav.c&&D.cats.find(c=>c.id===nav.c);
  if(cat){const its=itemsOf(D,cat.id);let g=null;
    h=`<div class="back"><button class="btn gray sm" id="bBack">← 목록</button><h2>${esc(cat.name)}</h2></div>`+(cat.note?`<div class="cnote">${esc(cat.note)}</div>`:'')+
      (cat.warn&&cat.warn.length?`<div class="cnote" style="color:var(--warn)">${cat.warn.map(esc).join('<br>')}</div>`:'');
    its.forEach(it=>{if((it.g||'')!==g){g=it.g||'';if(g)h+=`<div class="grp">${esc(g)}</div>`}h+=itemCard(D,it,'',false)});
    if(!its.length)h+='<div class="empty">아직 품목이 없습니다</div>';
    h+=`<div class="foot"><button class="btn green" id="bAddI">+ 이 분류에 품목 추가</button></div><div class="note">품목을 누르면 수량·생산일자를 넣고 고치고 뺄 수 있습니다. 주황 테두리는 생산일자가 가장 오래된 것(먼저 낼 것)입니다.</div>`;
    m.innerHTML=h;$('#bBack').onclick=()=>{nav.c='';render();scrollTo(0,0)};$('#bAddI').onclick=()=>openItemEdit(null,cat.id);bindItems();bar();return}
  h='<div class="cats">'+D.cats.slice().sort((a,b)=>(a.o||0)-(b.o||0)).map(c=>{const its=itemsOf(D,c.id),ls=its.flatMap(it=>lotsOf(D,it.k));
    return `<div class="cat" data-c="${esc(c.id)}"><div class="ic">재고</div><div class="nm">${esc(c.name)}${c.warn&&c.warn.length&&!its.length?'<div class="wn">'+esc(c.warn[0])+'</div>':''}</div><div class="ct">품목 ${its.length} · 합계 ${num(sumL(ls))}</div></div>`}).join('')+
    '<div class="cat add" id="bAddC"><b>+</b>분류 추가</div></div>';
  h+=footHtml();m.innerHTML=h;m.querySelectorAll('.cat[data-c]').forEach(e=>e.onclick=()=>{nav.c=e.dataset.c;render();scrollTo(0,0)});$('#bAddC').onclick=openAddCat;bindFoot();bar()}
function openAddCat(){const D=view();openS(`<h3>새 분류 추가</h3><label>분류 이름</label><input id="aN" autocomplete="off" placeholder="예) 창고 동화 강마루"><label>설명 (규격·박스 수 등, 비워도 됨)</label><input id="aT" autocomplete="off">
  <div class="acts"><button class="btn green wide" id="aS">추가</button><button class="btn gray wide" id="aC">닫기</button></div><div class="note">분류 이름 바꾸기·순서·지우기는 [설정]에서 합니다.</div>`,()=>{setTimeout(()=>{const e=$('#aN');e&&e.focus()},80);$('#aC').onclick=closeS;
  $('#aS').onclick=()=>{const v=$('#aN').value.trim();if(!v){toast('분류 이름을 넣어 주세요');return}if(D.cats.some(c=>c.name===v)){toast('같은 이름의 분류가 이미 있습니다');return}
    needName(()=>{const id='c'+uid();push({a:'cat',c:id,v:{name:v,note:$('#aT').value.trim(),o:(D.cats.length?Math.max(...D.cats.map(c=>c.o||0)):0)+1}});closeS();nav.c=id;render();toast('분류를 추가했습니다. [+ 이 분류에 품목 추가]로 품목을 넣어 주세요',4000)})}})}
function footHtml(){return '<div class="foot"><button class="btn gray" id="bHist">전체 이력 보기</button><button class="btn gray" id="bCsv">엑셀로 받기</button><button class="btn gray" id="bShare">주소 나눠 주기</button><button class="btn gray" id="bSet">설정</button><button class="btn green" id="bHome" style="display:'+(STANDALONE?'none':'block')+'">📱 휴대폰 바탕화면에 바로가기 만들기</button></div>'+
  `<div class="note">분류을 누르면 품목이 나옵니다. 위 칸에 번호·이름·생산일자(예: 260916)를 치면 모든 분류에서 찾습니다.<br>모든 고침·지움은 누가 언제 했는지 이력에 남고, 되돌릴 수 있습니다.<br>기록하는 사람: ${esc(cfg.name||'아직 이름 없음')} · ver ${VER}</div>`}
function bindFoot(){$('#bHist').onclick=()=>openHist();$('#bShare').onclick=openShare;$('#bSet').onclick=openSet;$('#bHome').onclick=homeShortcut;$('#bCsv').onclick=csv}
function bindItems(){$('#main').querySelectorAll('.it').forEach(e=>e.onclick=()=>openItem(e.dataset.i))}
$('#q').addEventListener('input',()=>{clearTimeout(render.qt);render.qt=setTimeout(render,200)});

/* ---------- 창(시트) ---------- */
function openS(html,fn){sDirty=false;$('#sbox').innerHTML=html;$('#sheet').classList.add('on');$('#sbox').scrollTop=0;fn&&fn()}
function closeS(){$('#sheet').classList.remove('on')}
let sDirty=false;$('#sbox').addEventListener('input',()=>{sDirty=true});
$('#sheet').onclick=e=>{if(e.target.id!=='sheet')return;const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#sbox').contains(a)){a.blur();return}
  if(sDirty){toast('고치던 중입니다. [저장] 또는 [닫기]를 눌러 주세요');return}closeS()};

/* 이름: 고치기 전에 한 번 받아 두고 이 휴대폰에 기억 */
function needName(fn){if(cfg.name){fn();return}
  openS(`<h3>기록할 이름</h3><div class="note" style="margin-top:0">누가 고쳤는지 이력에 남기려고 한 번만 받습니다. 이 휴대폰에 기억합니다.</div><input id="nN" autocomplete="off" placeholder="예) 김기사"><div class="acts"><button class="btn green wide" id="nOk">확인</button><button class="btn gray wide" id="nC">취소</button></div>`,()=>{
    setTimeout(()=>{const e=$('#nN');e&&e.focus()},80);$('#nC').onclick=closeS;$('#nOk').onclick=()=>{const n=$('#nN').value.trim();if(!n){toast('이름을 넣어 주세요');return}cfg.name=n;sv('cfg',cfg);closeS();fn()}})}

function histRows(D,list,withUndo){if(!list.length)return '<div class="hi w">아직 기록이 없습니다</div>';
  return list.slice().reverse().map(x=>{const nm={add:'넣음',edit:'고침',del:'지움',undo:'되돌림',seed:'처음 자료'}[x.act]||x.act;let body;
    if(x.k==='seed')body=esc(x.n||'');
    else if(x.k==='cat')body='분류 '+esc(x.from?x.from.name:'없음')+' → <b>'+esc(x.to?x.to.name:'없음')+'</b>';
    else if(x.k==='item')body='품목 '+esc(itxt(x.from))+' → <b>'+esc(itxt(x.to))+'</b>'+(x.from&&x.from._lots&&!x.to?' (수량 '+Object.keys(x.from._lots).length+'줄 함께 지움)':'')+(x.from&&x.to&&x.from.c!==x.to.c?' (분류 '+esc(catName(D,x.from.c))+' → '+esc(catName(D,x.to.c))+')':'');
    else{const it=D.items[x.i];body=(withUndo==='all'?'<b>'+esc(iname(it))+'</b> ':'')+esc(ltxt(x.from))+' → <b>'+esc(ltxt(x.to))+'</b>'}
    const u=withUndo&&x.k!=='seed'?`<button data-u="${esc(x.id)}">이 전으로 되돌리기</button>`:'';
    return `<div class="hi"><span class="tag t-${x.act}">${nm}</span>${body}<br><span class="w">${hm(x.t)} · ${esc(x.by||'이름 없음')}</span>${u}</div>`}).join('')}
function bindUndo(after){$('#sbox').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const D=view(),x=D.log.find(l=>l.id===b.dataset.u);if(!x)return;
  needName(()=>{const v=x.from?JSON.parse(JSON.stringify(x.from)):null;
    if(x.k==='lot'){if(v&&!view().items[v.i]){toast('품목이 지워져 있어 먼저 품목을 되돌려 주세요',4000);return}push({a:'lot',l:x.key,v,u:x.id})}
    else if(x.k==='item')push({a:'item',i:x.key,v,u:x.id});
    else if(x.k==='cat'){if(!v&&Object.values(view().items).some(it=>it.c===x.key)){toast('품목이 남아 있는 분류은 지울 수 없습니다',4000);return}push({a:'cat',c:x.key,v,u:x.id})}
    toast('그 전으로 되돌렸습니다');after?after():closeS()})})}

/* 품목 창: 수량 줄 목록 + 이력 */
function openItem(iid){const D=view(),it=D.items[iid];if(!it){closeS();render();return}
  const ls=lotsOf(D,iid),ok=oldestK(ls),hist=D.log.filter(x=>(x.k==='item'&&x.key===iid)||(x.k==='lot'&&x.i===iid));
  openS(`<h3>${it.disc?'<span class="tag t-disc">단종</span>':''}${esc(iname(it))}</h3><div class="note" style="margin-top:0">${esc(catName(D,it.c))}${it.g?' · '+esc(it.g):''}${it.note?'<br>'+esc(it.note):''}</div>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><b>수량 합계 ${num(sumL(ls))}</b><span class="note" style="margin:0">줄을 누르면 고치기</span></div>
   <div>${ls.map(l=>`<div class="lr${l.k===ok?' old':''}" data-l="${esc(l.k)}"><span class="q">${esc(num(l.q))}</span><span class="d">${l.d?esc(fmtD(l.d)):'날짜 없음'}${l.k===ok?' <span class="tag" style="background:var(--warn)">제일 오래됨</span>':''}</span><span class="n">${esc(l.n||'')}</span></div>`).join('')||'<div class="note">수량 기록이 없습니다</div>'}</div>
   <div class="acts"><button class="btn green wide" id="iAdd">+ 들어온 것 넣기 (수량·생산일자)</button><button class="btn gray" id="iEdit">품목 고치기</button><button class="btn gray" id="iC">닫기</button></div>
   <div class="hist"><h4>이 품목의 이력 (${hist.length}건)</h4>${histRows(D,hist,'item')}</div>`,()=>{
    $('#iC').onclick=closeS;$('#iAdd').onclick=()=>openLot(iid,null);$('#iEdit').onclick=()=>openItemEdit(iid);
    $('#sbox').querySelectorAll('.lr').forEach(e=>e.onclick=()=>openLot(iid,e.dataset.l));bindUndo(()=>openItem(iid))})}
function normDate(s){s=String(s||'').replace(/\D/g,'');if(!s)return '';if(s.length===6)s=(+s.slice(0,2)>30?'19':'20')+s;
  if(!/^\d{8}$/.test(s))return null;const m=+s.slice(4,6),d=+s.slice(6);if(m<1||m>12||d<1||d>31)return null;return s}
function openLot(iid,lk){const D=view(),it=D.items[iid],l=lk?D.lots[lk]:null;
  openS(`<h3>${esc(iname(it))} ${l?'수량 고치기':'들어온 것 넣기'}</h3>
   <div class="row2"><div><label>수량</label><input id="lQ" inputmode="decimal" autocomplete="off" value="${l?esc(num(l.q)):''}" placeholder="예) 80"></div>
   <div><label>생산일자 (6자리나 8자리)</label><input id="lD" inputmode="numeric" autocomplete="off" maxlength="10" value="${l?esc(l.d):''}" placeholder="260916"></div></div>
   <label>비고 (선반·10번창고·주차장·서두 등)</label><input id="lN" autocomplete="off" value="${l?esc(l.n||''):''}">
   ${l?'<div class="note">일부만 나갔으면 남은 수량으로 고쳐 저장하세요. 다 나갔으면 [다 나감]을 누르세요.</div>':''}
   <div class="acts"><button class="btn green wide" id="lS">${l?'고쳐서 저장':'넣고 저장'}</button>${l?'<button class="btn red wide" id="lX">다 나감 (이 줄 지우기)</button>':''}<button class="btn gray wide" id="lC">뒤로</button></div>`,()=>{
    if(!l)setTimeout(()=>{const e=$('#lQ');e&&e.focus()},80);$('#lC').onclick=()=>openItem(iid);
    $('#lS').onclick=()=>{const qs=$('#lQ').value.trim().replace(/,/g,''),q=+qs,d=normDate($('#lD').value);
      if(!qs||isNaN(q)||q<0){toast('수량을 숫자로 넣어 주세요');return}if(d===null){toast('생산일자는 260916 또는 20260916처럼 넣어 주세요');return}

  openS('<h3>바탕화면에 바로가기 만들기</h3><div class="note" style="font-size:15px;line-height:1.8;color:#17211c">'+steps+'</div><div class="note">바탕화면에는 상자 그림과 "창고재고" 이름으로 생깁니다. 처음 설정(출입증)은 그대로 남아 있습니다.</div><button class="btn gray" id="hC" style="width:100%;margin-top:12px">닫기</button>',()=>{$('#hC').onclick=closeS})}
