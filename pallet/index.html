<style>

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;display:none;max-width:92vw;text-align:center}

<script>
'use strict';
const VER='0.41';
const ICON_V='030';
const STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
let instEv=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e});

const REPO_DEF='ds4eqm-lgtm/pallet-box',FILE='yard.json',SECTORS=['B','A'];
const LS='pl1_',$=s=>document.querySelector(s);
const GH=()=>window.PL_GH||'https://api.github.com';
const POLL=()=>window.PL_POLL_MS||(document.hidden?60000:8000);
let cfg={},data=null,sha='',etag='',pend=[],busy=false,st={k:'',t:'',at:0},hitKey='',curCell=null;
function ld(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||2800)}
function hm(t){if(!t)return '';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function blank(){return {v:1,size:{A:8,B:8},cells:{},log:[]}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const LVN={U:'위(2단)',L:'아래(1단)'};
function cname(c){const p=c.split('-');return p[0]+'구역 '+p[1]+'번 '+LVN[p[2]]}
function fmtS(d){d=String(d||'');return /^\d{8}$/.test(d)?d.slice(2):d}
function fmtD(d){d=String(d||'');return /^\d{8}$/.test(d)?d.slice(0,4)+'.'+d.slice(4,6)+'.'+d.slice(6):d}
function vtxt(v){return v?(v.no||'?')+(v.d?' ('+fmtD(v.d)+')':''):'비어 있음'}

/* ---------- 설정: 주소 끝 #t=출입증 으로 받는다 ---------- */
function readHash(){const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);const t=h.get('t')||q.get('t'),r=h.get('r')||q.get('r');
  if(t){cfg.tok=t.trim();if(r)cfg.repo=r.trim();sv('cfg',cfg)}}
cfg=ld('cfg',{});readHash();if(!cfg.repo)cfg.repo=REPO_DEF;
pend=ld('pend',[]);data=ld('cache',null);
const OFFICIAL='https://ds4eqm-lgtm.github.io/commerce-insight/pallet/',LIVE=!!window.PL_FORCE_LIVE||location.protocol==='https:'&&location.hostname==='ds4eqm-lgtm.github.io';
function shareUrl(){return (LIVE?location.origin+location.pathname:OFFICIAL)+'#t='+encodeURIComponent(cfg.tok)+(cfg.repo!==REPO_DEF?'&r='+encodeURIComponent(cfg.repo):'')}

/* ---------- 깃허브 읽기·쓰기 ---------- */
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function gh(path,opt){opt=opt||{};const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
  try{return await fetch(GH()+'/repos/'+cfg.repo+path,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+cfg.tok,'Accept':'application/vnd.github+json'},opt.headers||{}),signal:ac.signal,cache:'no-store'}))}
  catch(e){throw new Error('net')}finally{clearTimeout(tm)}}
function ghErr(r){return r.status===401?'tok':r.status===404?'repo':r.status===403||r.status===429?(r.headers.get('x-ratelimit-remaining')==='0'?'rate':'perm'):'net'}
const MSG={tok:'출입증(토큰)이 틀렸거나 기한이 지났습니다. 관리자에게 새 주소를 받아 주세요',repo:'기록 저장소(pallet-box)를 찾지 못했습니다. 저장소를 만들었는지, 출입증을 만들 때 그 저장소를 골랐는지 확인해 주세요',
  perm:'출입증에 쓰기 권한이 없습니다. 출입증을 만들 때 Contents(콘텐츠: 파일)를 Read and write(읽기와 쓰기)로 해 주세요',rate:'깃허브 사용 한도에 잠시 걸렸습니다. 조금 뒤 저절로 다시 맞춥니다',
  net:'인터넷에 연결되지 않았습니다. 입력한 것은 휴대폰에 보관했다가 연결되면 저절로 올립니다',bad:'기록 파일을 읽지 못했습니다'};
async function pull(force){
  const r=await gh('/contents/'+FILE,{headers:etag&&!force?{'If-None-Match':etag}:{}});
  if(r.status===304)return false;
  if(r.status===404){const rr=await gh('');if(!rr.ok)throw new Error(ghErr(rr));if(!data||sha){data=blank()}sha='';etag='';return true}
  if(!r.ok)throw new Error(ghErr(r));
  const j=await r.json();let txt='';
  if(j.content)txt=new TextDecoder().decode(b64d(j.content));
  else{const g=await gh('/git/blobs/'+j.sha);if(!g.ok)throw new Error(ghErr(g));txt=new TextDecoder().decode(b64d((await g.json()).content))}
  let o;try{o=JSON.parse(txt)}catch(e){throw new Error('bad')}
  data=Object.assign(blank(),o);sha=j.sha;etag=r.headers.get('ETag')||'';sv('cache',data);return true}
/* 바뀐 것(op)을 받은 기록에 얹는다. 같은 op가 이미 올라가 있으면 건너뛴다 */
function applyOp(D,op){
  if(D.log.some(x=>x.id===op.id))return;
  const by=op.by||'',t=op.t;
  if(op.a==='dests'){const L=(D.dests||DESTS).slice(),i=L.indexOf(op.name);
    let at=null;if(op.act==='add'){if(!op.name||i>=0)return;if(op.at!=null&&op.at>=0&&op.at<=L.length)L.splice(op.at,0,op.name);else L.push(op.name)}else if(op.act==='del'){if(i<0)return;at=i;L.splice(i,1)}else if(op.act==='ren'){if(i<0||!op.to||L.includes(op.to))return;L[i]=op.to}else return;
    D.dests=L;D.log.push({id:op.id,t,by,a:'dst',act:op.act,c:'',from:op.name,to:op.to||'',at:at!=null?at:undefined,undo:op.undo||undefined});return}
  if(op.a==='size'){const from=Object.assign({},D.size);D.size=Object.assign({},D.size,op.size);D.log.push({id:op.id,t,by,a:'set',c:'',from,to:D.size});return}
  if(op.a==='move'){const f=D.cells[op.c]||null,g=D.cells[op.to]||null;if(!f)return;
    D.cells[op.to]=Object.assign({},f,{t,by});if(g)D.cells[op.c]=Object.assign({},g,{t,by});else delete D.cells[op.c];
    D.log.push({id:op.id,t,by,a:'move',c:op.c,to:op.to,from:f,swap:g});return}
  const before=D.cells[op.c]||null;let a=op.a;
  if(op.v){D.cells[op.c]={no:op.v.no,d:op.v.d,t,by};if(a!=='undo')a=before?'edit':'add'}else{if(!before&&a!=='undo')return;delete D.cells[op.c];if(a!=='undo')a='del'}
  D.log.push({id:op.id,t,by,a,c:op.c,from:before,to:op.v||null,dest:op.dest||''})}
function view(){const D=JSON.parse(JSON.stringify(data||blank()));pend.forEach(op=>applyOp(D,op));return D}
async function sync(force,depth){if(!cfg.tok)return;depth=depth||0;
  if(busy){if(force||pend.length)setTimeout(()=>sync(force),1200);return}busy=true;
  try{
    const changed=await pull(force||depth>0);
    if(pend.length){
      const D=JSON.parse(JSON.stringify(data||blank())),sent=pend.slice();sent.forEach(op=>applyOp(D,op));
      const body={message:'팔레트 기록 '+sent.map(o=>o.a+' '+(o.c||'')).join(', ').slice(0,120)+' ('+(cfg.name||'이름 없음')+')',content:b64e(new TextEncoder().encode(JSON.stringify(D)))};if(sha)body.sha=sha;
      const p=await gh('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
      if((p.status===409||p.status===422)&&depth<4){busy=false;etag='';return sync(true,depth+1)}
      if(!p.ok)throw new Error(ghErr(p));
      const pj=await p.json();sha=pj.content&&pj.content.sha||'';etag='';data=D;sv('cache',data);
      pend=pend.filter(o=>!sent.some(s=>s.id===o.id));sv('pend',pend);render()}
    else if(changed)render();
    st={k:'ok',t:'',at:Date.now()};
  }catch(e){st={k:'err',t:MSG[e.message]||MSG.net,code:e.message,at:st.at}}

const invNorm=t=>String(t||'').replace(/\s+/g,'');
function invName(v){return (v.no||'').trim()+(v.d?' '+String(v.d).slice(2):'')}
async function invSend(v,dest,from){const nm=invName(v);
  try{const {F,db}=await invDb();const cs=await F.getDocs(F.collection(db,'categories'));
    let cat=cs.docs.find(x=>invNorm(x.data().name)===invNorm(dest)),cid=cat&&cat.id,cnm=cat?cat.data().name:dest;
    if(!cid){const r=await F.addDoc(F.collection(db,'categories'),{name:dest,order:cs.size,createdAt:F.serverTimestamp()});cid=r.id;
      await F.addDoc(F.collection(db,'logs'),{message:'[분류 추가] "'+dest+'" (야적장에서 보내며 만듦)',author:cfg.name||'이름없음',createdAt:F.serverTimestamp()})}
    const is=await F.getDocs(F.query(F.collection(db,'items'),F.where('categoryId','==',cid)));
    const same=is.docs.find(x=>{const d=x.data();return invNorm(d.name)===invNorm(nm)&&d.unit==='팔레트'});
    if(same)await F.updateDoc(same.ref,{qty:(Number(same.data().qty)||0)+1});
    else await F.addDoc(F.collection(db,'items'),{categoryId:cid,name:nm,unit:'팔레트',qty:1,price:0,location:'야적장 '+from+'에서',createdAt:F.serverTimestamp()});
    await F.addDoc(F.collection(db,'logs'),{message:'[야적장 → '+cnm+'] "'+nm+'" 1팔레트 (야적장 '+from+'에서)',author:cfg.name||'이름없음',createdAt:F.serverTimestamp()});
    toast(from+' → '+cnm+' 이동했습니다 (재고관리에 들어감)')}
  catch(e){console.error(e);toast(from+' → '+dest+' 이동은 기록했지만 재고관리에 넣지 못했습니다. 재고관리에서 직접 넣어 주세요',6000)}}

  askReplace('바탕화면 바로가기를 새 팔레트 아이콘으로 바꾸시겠습니까?',()=>{if(instEv)doPrompt();else doShortcut()})},1500)});

/* ver 0.34: 새 아이콘이 나오면 예전 아이콘으로 만든 바로가기도 바꿀지 열 때 묻는다 (모든 브라우저·운영체제) */
function iconRefresh(){const ua=navigator.userAgent,and=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  lsS('pl_icon_v',ICON_V);lsS('pl_sc_made','1');
  if(instEv){doPrompt();return}
  if(ios){iosShortcut();return}
  if(WINPC){iconMaker();return}
  if(and&&STANDALONE){toast(/SamsungBrowser/.test(ua)?'삼성 인터넷은 아이콘을 스스로 바꾸지 못합니다. 홈 화면 아이콘을 지운 뒤 [바탕화면에 바로가기]를 눌러 주세요':'홈 화면 아이콘은 크롬이 곧 새 그림으로 바꿉니다. 바뀌었다고 물으면 [확인]만 누르세요',9000);return}
  doShortcut()}
(function(){const had=STANDALONE||lsG('pl_sc_made');const made=lsG('pl_icon_v');
  if(!had||made===ICON_V)return;
  if(Date.now()-(+lsG('pl_rep_skip')||0)<86400000)return;
  setTimeout(()=>{if($('#rep').style.display==='block'||$('#upd').style.display==='block')return;
    askReplace('팔레트 아이콘이 새 그림으로 바뀌었습니다. 바탕화면(홈 화면) 아이콘도 바꾸시겠습니까?',iconRefresh)},1300)})();
$('#bInst').onclick=homeShortcut;showInst();


/* ---------- ver 0.33: 윈도우 PC 바탕화면 아이콘 만들기 파일 ----------
   브라우저는 웹이 바탕화면에 아이콘 달린 바로가기(.lnk/.url)를 쓰는 것을 막는다.
   그래서 한 번 실행하면 팔레트 아이콘 바로가기를 만들고, 크롬 모양 예전 파일을 지우고, 스스로 지워지는 작은 파일을 준다. */
const UA0=navigator.userAgent,WINPC=/Windows NT/.test(UA0)&&!/Android|iPhone|iPad/.test(UA0);
const PLAIN_CHROME=/Chrome\//.test(UA0)&&!/Edg\/|OPR\/|Whale\/|SamsungBrowser|YaBrowser|Vivaldi/.test(UA0);
function psq(x){return "'"+String(x).replace(/'/g,"''")+"'"}
function iconMakerPs(u){const pref=/Edg\//.test(UA0)?'edge':/Whale\//.test(UA0)?'whale':'chrome';
  return [
"$ErrorActionPreference='SilentlyContinue'",
"$url="+psq(u),"$name="+psq('야적장 팔레트 배치도'),"$pref="+psq(pref),
"$h=Join-Path $env:LOCALAPPDATA 'PalletYard'; New-Item -ItemType Directory -Force $h | Out-Null",
"Get-ChildItem $h -Filter 'pallet*.ico' | Remove-Item -Force",
"$ico=Join-Path $h 'pallet_030.ico'",
"try{[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12}catch{}",
"Invoke-WebRequest -UseBasicParsing "+psq(OFFICIAL+'favicon.ico?v=030')+" -OutFile $ico",
"$pf=$env:ProgramFiles; $px=${env:ProgramFiles(x86)}; $la=$env:LOCALAPPDATA",
"$c=@{chrome=@(\"$pf\\Google\\Chrome\\Application\\chrome.exe\",\"$px\\Google\\Chrome\\Application\\chrome.exe\",\"$la\\Google\\Chrome\\Application\\chrome.exe\");edge=@(\"$px\\Microsoft\\Edge\\Application\\msedge.exe\",\"$pf\\Microsoft\\Edge\\Application\\msedge.exe\");whale=@(\"$pf\\Naver\\Naver Whale\\Application\\whale.exe\",\"$px\\Naver\\Naver Whale\\Application\\whale.exe\",\"$la\\Naver\\Naver Whale\\Application\\whale.exe\")}",
"$exe=$null; foreach($k in @($pref,'chrome','edge','whale')){ foreach($e in $c[$k]){ if(-not $exe -and (Test-Path $e)){$exe=$e} } }",
"$d=[Environment]::GetFolderPath('Desktop')",
"foreach($x in @('.html','.url','.lnk')){ Remove-Item (Join-Path $d ($name+$x)) -Force }",
"$s=(New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $d ($name+'.lnk')))",
"if($exe){$s.TargetPath=$exe; $s.Arguments='--app='+$url; $s.WorkingDirectory=Split-Path $exe}else{$s.TargetPath=$url}",
"if(Test-Path $ico){$s.IconLocation=$ico+',0'}",
"$s.Description=$name; $s.Save()",
"try{& (Join-Path $env:SystemRoot 'System32\\ie4uinit.exe') -show}catch{}"
  ].join('\r\n')}
function utf16b64(t){const u=new Uint8Array(t.length*2);for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);u[i*2]=c&255;u[i*2+1]=c>>8}return b64e(u)}
function iconMakerBat(u){return '@echo off\r\npowershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -EncodedCommand '+utf16b64(iconMakerPs(u))+'\r\n(goto) 2>nul & del "%~f0"\r\n'}
function iconMaker(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([iconMakerBat(liveUrl())],{type:'application/octet-stream'}));
  a.download='pallet_icon.bat';document.body.appendChild(a);a.click();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove()}catch(e){}},3000);
  toast('내려받은 pallet_icon 파일을 한 번 열면 바탕화면에 팔레트 아이콘이 생깁니다',9000)}
window.PL_iconMakerPs=iconMakerPs;

/* ---------- 새 버전 알림 (ver 0.19) ---------- */
function verCmp(a,b){const x=String(a).split('.').map(n=>parseInt(n,10)||0),y=String(b).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
let updSkip='',updAt=0;
function checkUpd(force){if(!force&&Date.now()-updAt<10*60000)return;updAt=Date.now();
  const base=window.PL_VERURL||(LIVE?location.origin+location.pathname.replace(/[^\/]*$/,''):OFFICIAL);
  fetch(base+'version.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.ver||verCmp(j.ver,VER)<=0||j.ver===updSkip)return;
    $('#updT').textContent='새 버전('+j.ver+')이 있습니다. 업데이트하시겠습니까?';$('#upd').style.display='block';$('#upd').dataset.v=j.ver}).catch(()=>{})}
$('#updNo').onclick=()=>{updSkip=$('#upd').dataset.v||'';$('#upd').style.display='none'};
$('#updGo').onclick=()=>{$('#updT').textContent='새 버전으로 바꾸는 중입니다. 기록은 그대로 남습니다.';
  /* ver 0.31: 업데이트 누를 때 바로가기가 없으면 새 팔레트 아이콘으로 함께 만든다 */
  if(LIVE&&!STANDALONE&&instEv){const e=instEv;instEv=null;let done=false;const fin=()=>{if(done)return;done=true;$('#updGo').onclick()};
    try{e.prompt();e.userChoice.then(fin,fin)}catch(x){fin()};setTimeout(fin,60000);return}
  if(!LIVE){location.href=OFFICIAL+(cfg.tok?'#t='+encodeURIComponent(cfg.tok)+(cfg.repo!==REPO_DEF?'&r='+encodeURIComponent(cfg.repo):''):'');return}
  const go=()=>location.reload();
  Promise.all(['./','index.html','manifest.json','sw.js'].map(u=>fetch(u,{cache:'reload'}).catch(()=>{})))
   .then(()=>navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}):0)
   .then(go,go);setTimeout(go,6000)};
checkUpd(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});

window.PL={parseVoice,normVoice,view,get pend(){return pend},sync};
