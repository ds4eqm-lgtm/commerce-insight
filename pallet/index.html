<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b57">
<meta name="robots" content="noindex">
<title>야적장 팔레트 배치도</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202a;--sub:#5d6b78;--line:#c9d1d9;--blue:#1f3b57;--up:#e7f0fb;--dn:#f3efe6;--ok:#1b6e3c;--warn:#a0521b;--red:#b3261e;--hl:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:8px 12px 8px}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
header h1 small{font-weight:400;font-size:12px;opacity:.75;margin-left:auto}
#bar{font-size:12px;margin-top:4px;padding:3px 8px;border-radius:6px;background:#555;display:inline-block}
#bar.ok{background:#1b6e3c}#bar.err{background:#a0521b}
.tools{display:flex;gap:6px;margin-top:8px}
.tools input{flex:1;min-width:0;font-size:16px;padding:9px 10px;border-radius:8px;border:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.btn.gray{background:#dfe4ea;color:var(--ink)}.btn.red{background:var(--red)}.btn.green{background:var(--ok)}.btn.org{background:var(--warn)}
.btn.mic{background:#e53935;white-space:nowrap}
.btn:disabled{opacity:.45}
main{padding:10px 8px 90px;max-width:720px;margin:0 auto}
.yard{display:grid;grid-template-columns:22px 26px 1fr .5fr 1fr 22px;gap:6px 6px;align-items:stretch}
.road,.house{grid-column:1;border-right:3px solid #555;color:#33414e;writing-mode:vertical-rl;text-align:center;font-size:12px;font-weight:700;letter-spacing:4px;padding:6px 0}
.road span,.house span{padding:4px 0;position:sticky;top:140px}.house{grid-column:6;border-right:0;border-left:3px solid #555}.roadtop{text-align:center;font-size:12px;font-weight:700;color:#33414e;border-bottom:3px solid #555;padding-bottom:2px}
.colh{text-align:center;font-weight:800;font-size:16px;padding:6px 0;background:#d9e2ec;border-radius:8px}
.num{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--sub)}
.slot{background:var(--card);border:2px solid #8a99a8;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:112px}
.half{flex:1;padding:5px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:54px}
.half.u{background:var(--up);border-bottom:2px dashed #8a99a8}.half.l{background:var(--dn)}
.half .lv{position:absolute;right:5px;top:3px;font-size:10px;color:var(--sub);font-weight:700}
.half .no{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.1;word-break:break-all}
.half .dt{font-size:13px;color:#33414e;margin-top:2px}
.half .em{font-size:13px;color:#9aa6b2}
.half.hit{outline:4px solid var(--hl);outline-offset:-4px;background:#fff6cc}
.half.old .no::after{content:"제일 오래됨";font-size:10px;font-weight:700;background:var(--warn);color:#fff;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:middle}
.half.pend::before{content:"올리는 중";position:absolute;left:5px;top:3px;font-size:10px;color:#fff;background:#888;border-radius:4px;padding:0 4px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot .btn{flex:1;min-width:140px}
.note{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.6}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 8px;font-size:19px}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
.box input,.box select,.box textarea{width:100%;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px}
.box input:focus{border-color:var(--blue);outline:0}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .wide{grid-column:1/-1}
#heard{font-size:14px;color:#333;background:#f4f6f8;border-radius:8px;padding:8px;margin-top:8px;min-height:20px;display:none}
.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.hist h4{margin:4px 0 6px;font-size:15px}
.hi{font-size:13px;padding:7px 0;border-bottom:1px solid #eef1f4;line-height:1.5}
.hi b{font-weight:700}.hi .w{color:var(--sub)}
.hi button{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;margin-left:6px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#fff;margin-right:4px}
.t-add{background:#1b6e3c}.t-edit{background:#1f5fa0}.t-del{background:#b3261e}.t-move{background:#7a4fb0}.t-undo{background:#666}.t-set{background:#555}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;display:none;max-width:92vw;text-align:center}
.setup{background:#fff;border-radius:12px;padding:14px;line-height:1.7;font-size:15px}
.setup .btn{width:100%;margin:6px 0}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr img,#qr canvas{width:220px;height:220px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#f4f6f8;padding:8px;border-radius:8px}
.listen{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<header>
  <h1>야적장 LVT 배치도 <small id="ver"></small></h1>
  <div id="bar">불러오는 중</div>
  <div class="tools">
    <input id="q" inputmode="numeric" placeholder="팔레트 번호 찾기" autocomplete="off">
    <button class="btn mic" id="gMic" type="button">🎤 말로 기록</button>
  </div>
</header>
<main id="main"></main>
<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
const VER='1.1';
const REPO_DEF='ds4eqm-lgtm/pallet-box',FILE='yard.json',SECTORS=['B','A'];
const LS='pl1_',$=s=>document.querySelector(s);
const GH=()=>window.PL_GH||'https://api.github.com';
const POLL=()=>window.PL_POLL_MS||(document.hidden?60000:8000);
let cfg={},data=null,sha='',etag='',pend=[],busy=false,st={k:'',t:'',at:0},hitKey='',curCell=null;
function ld(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||2800)}
function hm(t){if(!t)return '';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function blank(){return {v:1,size:{A:8,B:8},cells:{},log:[]}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const LVN={U:'위(2단)',L:'아래(1단)'};
function cname(c){const p=c.split('-');return p[0]+'구역 '+p[1]+'번 '+LVN[p[2]]}
function fmtD(d){d=String(d||'');return /^\d{8}$/.test(d)?d.slice(0,4)+'.'+d.slice(4,6)+'.'+d.slice(6):d}
function vtxt(v){return v?(v.no||'?')+(v.d?' ('+fmtD(v.d)+')':''):'비어 있음'}

/* ---------- 설정: 주소 끝 #t=출입증 으로 받는다 ---------- */
function readHash(){const h=new URLSearchParams(location.hash.slice(1));const t=h.get('t'),r=h.get('r');
  if(t){cfg.tok=t.trim();if(r)cfg.repo=r.trim();sv('cfg',cfg)}}
cfg=ld('cfg',{});readHash();if(!cfg.repo)cfg.repo=REPO_DEF;
pend=ld('pend',[]);data=ld('cache',null);
const OFFICIAL='https://ds4eqm-lgtm.github.io/commerce-insight/pallet/',LIVE=location.protocol==='https:'&&location.hostname==='ds4eqm-lgtm.github.io';
function shareUrl(){return (LIVE?location.origin+location.pathname:OFFICIAL)+'#t='+encodeURIComponent(cfg.tok)+(cfg.repo!==REPO_DEF?'&r='+encodeURIComponent(cfg.repo):'')}

/* ---------- 깃허브 읽기·쓰기 ---------- */
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function gh(path,opt){opt=opt||{};const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
  try{return await fetch(GH()+'/repos/'+cfg.repo+path,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+cfg.tok,'Accept':'application/vnd.github+json'},opt.headers||{}),signal:ac.signal,cache:'no-store'}))}
  catch(e){throw new Error('net')}finally{clearTimeout(tm)}}
function ghErr(r){return r.status===401?'tok':r.status===404?'repo':r.status===403||r.status===429?(r.headers.get('x-ratelimit-remaining')==='0'?'rate':'perm'):'net'}
const MSG={tok:'출입증(토큰)이 틀렸거나 기한이 지났습니다. 관리자에게 새 주소를 받아 주세요',repo:'기록 저장소(pallet-box)를 찾지 못했습니다. 저장소를 만들었는지, 출입증을 만들 때 그 저장소를 골랐는지 확인해 주세요',
  perm:'출입증에 쓰기 권한이 없습니다. 출입증을 만들 때 Contents(콘텐츠: 파일)를 Read and write(읽기와 쓰기)로 해 주세요',rate:'깃허브 사용 한도에 잠시 걸렸습니다. 조금 뒤 저절로 다시 맞춥니다',
  net:'인터넷에 연결되지 않았습니다. 입력한 것은 휴대폰에 보관했다가 연결되면 저절로 올립니다',bad:'기록 파일을 읽지 못했습니다'};
async function pull(force){
  const r=await gh('/contents/'+FILE,{headers:etag&&!force?{'If-None-Match':etag}:{}});
  if(r.status===304)return false;
  if(r.status===404){const rr=await gh('');if(!rr.ok)throw new Error(ghErr(rr));if(!data||sha){data=blank()}sha='';etag='';return true}
  if(!r.ok)throw new Error(ghErr(r));
  const j=await r.json();let txt='';
  if(j.content)txt=new TextDecoder().decode(b64d(j.content));
  else{const g=await gh('/git/blobs/'+j.sha);if(!g.ok)throw new Error(ghErr(g));txt=new TextDecoder().decode(b64d((await g.json()).content))}
  let o;try{o=JSON.parse(txt)}catch(e){throw new Error('bad')}
  data=Object.assign(blank(),o);sha=j.sha;etag=r.headers.get('ETag')||'';sv('cache',data);return true}
/* 바뀐 것(op)을 받은 기록에 얹는다. 같은 op가 이미 올라가 있으면 건너뛴다 */
function applyOp(D,op){
  if(D.log.some(x=>x.id===op.id))return;
  const by=op.by||'',t=op.t;
  if(op.a==='size'){const from=Object.assign({},D.size);D.size=Object.assign({},D.size,op.size);D.log.push({id:op.id,t,by,a:'set',c:'',from,to:D.size});return}
  if(op.a==='move'){const f=D.cells[op.c]||null,g=D.cells[op.to]||null;if(!f)return;
    D.cells[op.to]=Object.assign({},f,{t,by});if(g)D.cells[op.c]=Object.assign({},g,{t,by});else delete D.cells[op.c];
    D.log.push({id:op.id,t,by,a:'move',c:op.c,to:op.to,from:f,swap:g});return}
  const before=D.cells[op.c]||null;let a=op.a;
  if(op.v){D.cells[op.c]={no:op.v.no,d:op.v.d,t,by};if(a!=='undo')a=before?'edit':'add'}else{if(!before&&a!=='undo')return;delete D.cells[op.c];if(a!=='undo')a='del'}
  D.log.push({id:op.id,t,by,a,c:op.c,from:before,to:op.v||null})}
function view(){const D=JSON.parse(JSON.stringify(data||blank()));pend.forEach(op=>applyOp(D,op));return D}
async function sync(force,depth){if(!cfg.tok)return;depth=depth||0;
  if(busy){if(force||pend.length)setTimeout(()=>sync(force),1200);return}busy=true;
  try{
    const changed=await pull(force||depth>0);
    if(pend.length){
      const D=JSON.parse(JSON.stringify(data||blank())),sent=pend.slice();sent.forEach(op=>applyOp(D,op));
      const body={message:'팔레트 기록 '+sent.map(o=>o.a+' '+(o.c||'')).join(', ').slice(0,120)+' ('+(cfg.name||'이름 없음')+')',content:b64e(new TextEncoder().encode(JSON.stringify(D)))};if(sha)body.sha=sha;
      const p=await gh('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
      if((p.status===409||p.status===422)&&depth<4){busy=false;etag='';return sync(true,depth+1)}
      if(!p.ok)throw new Error(ghErr(p));
      const pj=await p.json();sha=pj.content&&pj.content.sha||'';etag='';data=D;sv('cache',data);
      pend=pend.filter(o=>!sent.some(s=>s.id===o.id));sv('pend',pend);render()}
    else if(changed)render();
    st={k:'ok',t:'',at:Date.now()};
  }catch(e){st={k:'err',t:MSG[e.message]||MSG.net,code:e.message,at:st.at}}
  finally{busy=false;bar()}}
function push(op){op.id=uid();op.t=Date.now();op.by=cfg.name||'';pend.push(op);sv('pend',pend);render();sync(true)}
function bar(){const b=$('#bar');if(!cfg.tok){b.className='err';b.textContent='처음 설정이 필요합니다';return}
  let t;if(st.k==='err')t=(st.code==='net'?'인터넷 없음':'확인 필요')+(pend.length?' · 올릴 것 '+pend.length+'개 보관 중':'');
  else if(st.k==='ok')t='모두 맞춤 · '+new Date(st.at).toLocaleTimeString('ko-KR')+' 확인'+(pend.length?' · 올리는 중 '+pend.length:'');
  else t='맞추는 중';b.className=st.k==='ok'&&!pend.length?'ok':st.k==='err'?'err':'';b.textContent=t;
  b.onclick=st.k==='err'?()=>toast(st.t,5000):null}

/* ---------- 화면 ---------- */
function render(){const m=$('#main');if(!cfg.tok){setup();return}
  const D=view(),q=$('#q').value.trim(),pk=new Set(pend.flatMap(o=>[o.c,o.to]).filter(Boolean));
  let old=null;Object.entries(D.cells).forEach(([k,v])=>{if(/^\d{8}$/.test(v.d||'')&&(!old||v.d<old.d))old={k,d:v.d}});
  const n=Math.max(D.size.A||8,D.size.B||8);let h=`<div class="yard"><div></div><div></div><div class="roadtop" style="grid-column:3/6">도로측</div><div></div><div class="road" style="grid-row:2/span ${n+1}"><span>공장측 골목</span></div><div class="house" style="grid-row:2/span ${n+1}"><span>주택</span></div><div></div>`;
  SECTORS.forEach((s,j)=>h+=(j?'<div></div>':'')+`<div class="colh">${s} 구역</div>`);
  for(let i=1;i<=n;i++){h+=`<div class="num">${i}</div>`;
    SECTORS.forEach((s,j)=>{if(j)h+='<div></div>';if(i>(D.size[s]||8)){h+='<div></div>';return}
      h+='<div class="slot">'+['U','L'].map(lv=>{const k=s+'-'+i+'-'+lv,v=D.cells[k];
        const hit=q&&v&&String(v.no).includes(q);
        return `<div class="half ${lv.toLowerCase()}${hit?' hit':''}${old&&old.k===k?' old':''}${pk.has(k)?' pend':''}" data-k="${k}"><span class="lv">${lv==='U'?'위':'아래'}</span>`+
          (v?`<div class="no">${esc(v.no)}</div><div class="dt">${esc(fmtD(v.d))}</div>`:'<div class="em">비어 있음</div>')+'</div>'}).join('')+'</div>'})}
  h+='</div><div class="foot"><button class="btn gray" id="bHist">전체 이력 보기</button><button class="btn gray" id="bShare">주소 나눠 주기</button><button class="btn gray" id="bSet">설정</button></div>'+
   `<div class="note">칸을 누르면 번호와 생산일자를 넣거나 고치거나 뺄 수 있습니다. 위 칸이 2단(위에 올린 팔레트), 아래 칸이 1단(바닥 팔레트)입니다.<br>말로 기록: [🎤 말로 기록]을 누르고 "A 1번 위 1699 2026 10 11"처럼 말하면 해당 칸이 채워진 채로 열립니다. 빼낼 때는 "A 1번 위 삭제".<br>기록한 사람: ${esc(cfg.name||'아직 이름 없음')} · ver ${VER}</div>`;
  m.innerHTML=h;
  m.querySelectorAll('.half').forEach(e=>e.onclick=()=>openCell(e.dataset.k));
  $('#bHist').onclick=()=>openHist();$('#bShare').onclick=openShare;$('#bSet').onclick=openSet;
  const f=m.querySelector('.half.hit');if(f&&render.scroll){f.scrollIntoView({block:'center',behavior:'smooth'});render.scroll=false}
  bar()}
function openS(html,fn){$('#sbox').innerHTML=html;$('#sheet').classList.add('on');fn&&fn()}
function closeS(){stopRec();$('#sheet').classList.remove('on');curCell=null}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeS()};
function histRows(list,withUndo){if(!list.length)return '<div class="hi w">아직 기록이 없습니다</div>';
  return list.slice().reverse().map(x=>{const nm={add:'넣음',edit:'고침',del:'뺌',move:'옮김',undo:'되돌림',set:'설정'}[x.a]||x.a;
    let body;if(x.a==='move')body=`${esc(cname(x.c))} → ${esc(cname(x.to))} : ${esc(vtxt(x.from))}${x.swap?' (서로 바꿈: '+esc(vtxt(x.swap))+')':''}`;
    else if(x.a==='set')body='칸 수 '+SECTORS.map(s=>s+' '+(x.from&&x.from[s])+'→'+(x.to&&x.to[s])).join(', ');
    else body=(withUndo==='all'?'<b>'+esc(cname(x.c))+'</b> ':'')+esc(vtxt(x.from))+' → <b>'+esc(vtxt(x.to))+'</b>';
    const u=(x.a!=='move'&&x.a!=='set'&&withUndo)?`<button data-u="${esc(x.id)}">이 전으로 되돌리기</button>`:'';
    return `<div class="hi"><span class="tag t-${x.a}">${nm}</span>${body}<br><span class="w">${hm(x.t)} · ${esc(x.by||'이름 없음')}</span>${u}</div>`}).join('')}
function bindUndo(){$('#sbox').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const D=view(),x=D.log.find(l=>l.id===b.dataset.u);if(!x)return;
  if(!confirmName())return;push({a:'undo',c:x.c,v:x.from?{no:x.from.no,d:x.from.d}:null});toast(cname(x.c)+'을(를) '+vtxt(x.from)+'(으)로 되돌렸습니다');closeS()})}
function confirmName(){if(cfg.name)return true;const n=(prompt('기록에 남길 이름을 넣어 주세요 (예: 지게차 김기사)')||'').trim();if(!n)return false;cfg.name=n;sv('cfg',cfg);return true}

function openCell(k,pre){const D=view(),v=D.cells[k],p=pre||{};curCell=k;
  const hist=D.log.filter(x=>x.c===k||x.to===k);
  openS(`<h3>${esc(cname(k))}</h3>
   <div class="row2"><div><label>팔레트 번호</label><input id="fNo" inputmode="numeric" autocomplete="off" value="${esc(p.no!=null?p.no:v?v.no:'')}" placeholder="예) 1699"></div>

  t=t.replace(/(위층|윗단|상단|하단|2단|1단|2층|1층|이단|이층|일층)/g,' ');
  const nums=(t.match(/\d+/g)||[]);
  if(nums.length){r.no=nums[0];const rest=nums.slice(1);let d=null;
    if(rest.length>=3&&(rest[0].length===4||rest[0].length===2)){const y=rest[0].length===2?'20'+rest[0]:rest[0];d=normDate(y+rest[1].padStart(2,'0')+rest[2].padStart(2,'0'))}
    if(!d&&rest.length)d=normDate(rest.join(''));
    if(!d&&rest.length===2&&rest[0].length===4)d=normDate(rest[0]+rest[1].padStart(4,'0'));
    if(d)r.d=d}
  return r}
$('#gMic').onclick=()=>{if(!cfg.tok){toast('먼저 처음 설정을 해 주세요');return}listen(t=>{const r=parseVoice(t);
  if(!r.s||!r.n||!r.lv){toast('들은 말: "'+t+'" · 칸을 알아듣지 못했습니다. "A 1번 위 1699 2026 10 11"처럼 말해 주세요',6000);return}
  const D=view();if(r.n>(D.size[r.s]||8)){toast(r.s+'구역에는 '+r.n+'번 칸이 없습니다',4000);return}
  openCell(r.s+'-'+r.n+'-'+r.lv,{no:r.del?undefined:r.no,d:r.del?undefined:r.d,del:r.del});
  $('#heard').style.display='block';$('#heard').textContent='들은 말: '+t+(r.del?'':' · 맞으면 [저장]을 눌러 주세요')},$('#gMic'))};
$('#q').oninput=()=>{render.scroll=true;render()};
window.addEventListener('hashchange',()=>{readHash();render();sync(true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
window.addEventListener('online',()=>sync(true));
$('#ver').textContent='ver '+VER;
render();if(cfg.tok)sync(true);
(function loop(){setTimeout(()=>{if(cfg.tok&&!$('#sheet').classList.contains('on')||pend.length)sync();loop()},POLL())})();
window.PL={parseVoice,normVoice,view,get pend(){return pend},sync};
